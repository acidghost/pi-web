name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  # renovate: datasource=github-releases depName=jdx/mise
  MISE_VERSION: 2026.9.5

jobs:
  metadata:
    name: Validate release metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Validate tag and normalize version
        id: version
        run: |
          set -euo pipefail
          version_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          [[ "$GITHUB_REF_NAME" =~ $version_pattern ]] || {
            echo "Tag must be of the form vMAJOR.MINOR.PATCH: $GITHUB_REF_NAME" >&2
            exit 1
          }
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" != "0.0.0" ]] || {
            echo "v0.0.0 is a development placeholder and cannot be published" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Checkout main for ancestry validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Require the release commit to be on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" HEAD || {
            echo "Release commit $GITHUB_SHA is not reachable from main" >&2
            exit 1
          }

  build:
    name: Build and attest release
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: ${{ env.MISE_VERSION }}
          cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks and tests
        run: |
          bun run check
          bun run typecheck

      - name: Build release executables
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          echo "SOURCE_DATE_EPOCH=${source_date_epoch}" >> "$GITHUB_ENV"
          for target in linux-amd64 linux-arm64 darwin-arm64; do
            PI_WEB_BUILD_TARGET="$target" \
              PI_WEB_BUILD_OUTDIR="dist/staging/$target" \
              PI_WEB_BUILD_VERSION="$VERSION" \
              PI_WEB_BUILD_COMMIT="$GITHUB_SHA" \
              bun run build
          done

      - name: Package and verify release archives
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release
          for target in linux-amd64 linux-arm64 darwin-arm64; do
            staging="$(mktemp -d)"
            install -m 0755 "dist/staging/${target}/pi-web" "$staging/pi-web"
            touch -d "@${SOURCE_DATE_EPOCH}" "$staging/pi-web"
            archive="release/pi-web_${VERSION}_${target}.tar.gz"
            tar \
              --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 \
              --group=0 \
              --numeric-owner \
              -C "$staging" \
              -czf "$archive" \
              pi-web
            rm -rf "$staging"
          done
          cd release
          sha256sum -- *.tar.gz > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest release archives
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS

      - name: Include the attestation bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: cp "$BUNDLE_PATH" "release/pi-web_${VERSION}.intoto.jsonl"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: release
          path: release/*
          retention-days: 7

  github-release:
    name: Create GitHub release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: read
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: release

      - name: Verify checksums and provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          (cd release && sha256sum --check SHA256SUMS)
          for archive in release/*.tar.gz; do
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yaml" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
